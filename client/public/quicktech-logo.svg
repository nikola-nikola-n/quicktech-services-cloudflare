<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1e40af" rx="8"/>
  
  <!-- Circuit board pattern -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none">
    <!-- Horizontal lines -->
    <line x1="20" y1="30" x2="80" y2="30" opacity="0.3"/>
    <line x1="20" y1="50" x2="80" y2="50" opacity="0.3"/>
    <line x1="20" y1="70" x2="80" y2="70" opacity="0.3"/>
    
    <!-- Vertical lines -->
    <line x1="30" y1="20" x2="30" y2="80" opacity="0.3"/>
    <line x1="50" y1="20" x2="50" y2="80" opacity="0.3"/>
    <line x1="70" y1="20" x2="70" y2="80" opacity="0.3"/>
  </g>
  
  <!-- Central processor/chip -->
  <circle cx="50" cy="50" r="20" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Core processor -->
  <rect x="42" y="42" width="16" height="16" fill="#06b6d4" rx="2"/>
  
  <!-- Connection dots -->
  <circle cx="30" cy="30" r="2.5" fill="#06b6d4"/>
  <circle cx="70" cy="30" r="2.5" fill="#06b6d4"/>
  <circle cx="30" cy="70" r="2.5" fill="#06b6d4"/>
  <circle cx="70" cy="70" r="2.5" fill="#06b6d4"/>
  
  <!-- Connection lines from center -->
  <line x1="50" y1="50" x2="30" y2="30" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="70" y2="30" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="30" y2="70" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="50" x2="70" y2="70" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
</svg>
